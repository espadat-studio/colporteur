[tasks."lint"]
alias = "l"
description = "Run clippy"
run = "cargo clippy"
quiet = true
sources = ["src/**/*.rs", "Cargo.toml"]

[tasks."build"]
alias = "b"
run = "cargo build --release"
quiet = true
sources = ["src/**/*.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/colporteur"]

[tasks.test]
alias = "t"
description = "Run tests"
run = "cargo nextest run"
quiet = true
sources = ["src/**/*.rs", "Cargo.toml", "tests/**/*"]

[tools]
node = "26.13.0"
"cargo:cargo-nextest" = "0.9.151"
"cargo:convco" = "0.7.2"
dprint = "0.64.3"
hk = "2.11.1"
pkl = "0.33.0"
rust = "1.99.1"
