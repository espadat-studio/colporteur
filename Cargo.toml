[package]
name = "colporteur"
version = "0.6.5"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/espadat-studio/colporteur"
description = "Turn email newsletters into Atom feeds straight from your IMAP inbox. Strips trackers, needs no forwarding address or third-party service."

[lib]
name = "colporteur"
path = "src/lib.rs"

[[bin]]
name = "colporteur"
path = "src/main.rs"

[dependencies]
ammonia = "4"
atom_syndication = "0.12"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
env_logger = "0.11"
eyre = "0.6"
imap = "3.0.0-alpha.15"
log = "0.4"
mailparse = "0.17"
native-tls = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
